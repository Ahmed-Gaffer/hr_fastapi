@router.get("/calculate/{employee_id}/{year}/{month}")
async def calculate_salary_endpoint(
    employee_id: int,
    year: int,
    month: int,
    session: Session = Depends(get_session)
):
    """احسب راتب موظف للشهر (للتحقق والتقارير)"""
    from app.services.salary_calculator import SalaryCalculator
    
    try:
        calc = SalaryCalculator(session)
        result = calc.calculate_salary(employee_id, year, month)
        return result
    except Exception as e:
        raise HTTPException(status_code=500, detail=str(e))

