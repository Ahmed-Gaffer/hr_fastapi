# تحديث endpoints الحساب:
from app.services.professional_salary_calculator import ProfessionalSalaryCalculator

@router.get("/salary/{salary_id}/calculate")
async def calculate_salary_endpoint(salary_id: int, session: Session = Depends(get_session)):
    try:
        calc = ProfessionalSalaryCalculator(session)
        result = calc.calculate(salary_id)
        return result
    except Exception as e:
        raise HTTPException(status_code=500, detail=str(e))