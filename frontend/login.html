<!-- صفحة تسجيل دخول بسيطة -->

<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <style>
        /* تنسيق النموذج */
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            width: 300px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 10px;
            color: green;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>تسجيل الدخول</h2>

        <!-- مدخل اسم المستخدم -->
        <input type="text" id="username" placeholder="اسم المستخدم">

        <!-- مدخل كلمة المرور -->
        <input type="password" id="password" placeholder="كلمة المرور">

        <!-- زر تسجيل الدخول -->
        <button onclick="login()">دخول</button>

        <!-- مكان عرض التوكن -->
        <div id="result"></div>
    </div>

    <script>
        // دالة تسجيل الدخول
        async function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // إرسال البيانات إلى API
            const response = await fetch("http://127.0.0.1:8000/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            // عرض التوكن أو رسالة الخطأ
            if (response.ok) {
                document.getElementById("result").innerText = "توكن الدخول:\n" + data.access_token;
            } else {
                document.getElementById("result").innerText = "خطأ: " + data.detail;
            }
        }
    </script>

</body>
</html>
