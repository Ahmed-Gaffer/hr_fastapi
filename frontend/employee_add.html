<!-- صفحة إضافة موظف باستخدام HTMX و TailwindCSS -->
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إضافة موظف</title>

    <!-- استيراد مكتبة HTMX للتعامل مع FastAPI بدون JavaScript معقد -->
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>

    <!-- استيراد مكتبة TailwindCSS لتنسيق الواجهة بشكل احترافي -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<!-- تنسيق الصفحة: خلفية رمادية، محتوى في المنتصف -->
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <!-- صندوق إضافة الموظف -->
    <div class="bg-white p-6 rounded shadow w-96">
        <h2 class="text-xl mb-4 text-center">إضافة موظف جديد</h2>

        <!-- نموذج الإضافة باستخدام HTMX -->
        <form hx-post="/employees/add" hx-target="#result" hx-swap="innerHTML">
            <!-- مدخل الاسم الكامل -->
            <input type="text" name="full_name" placeholder="الاسم الكامل" class="w-full p-2 mb-2 border rounded">

            <!-- مدخل المسمى الوظيفي -->
            <input type="text" name="title" placeholder="المسمى الوظيفي" class="w-full p-2 mb-2 border rounded">

            <!-- مدخل رقم الهاتف -->
            <input type="text" name="phone" placeholder="رقم الهاتف" class="w-full p-2 mb-2 border rounded">

            <!-- اختيار الحالة -->
            <select name="status" class="w-full p-2 mb-2 border rounded">
                <option value="active">نشط</option>
                <option value="inactive">غير نشط</option>
            </select>

            <!-- زر الإضافة -->
            <button type="submit" class="w-full bg-green-600 text-white p-2 rounded">إضافة</button>
        </form>

        <!-- مكان عرض النتيجة -->
        <div id="result" class="mt-4 text-green-600 text-sm text-center"></div>
    </div>

</body>
</html>
