<!-- صفحة تسجيل دخول باستخدام HTMX و TailwindCSS -->
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>

    <!-- استيراد مكتبة HTMX للتعامل مع FastAPI بدون JavaScript معقد -->
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>

    <!-- استيراد مكتبة TailwindCSS لتنسيق الواجهة بشكل احترافي -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<!-- تنسيق الصفحة: خلفية رمادية، محتوى في المنتصف -->
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <!-- صندوق تسجيل الدخول -->
    <div class="bg-white p-6 rounded shadow w-96">
        <h2 class="text-xl mb-4 text-center">تسجيل الدخول</h2>

        <!-- نموذج تسجيل الدخول باستخدام HTMX -->
        <form hx-post="/auth/login" hx-target="#result" hx-swap="innerHTML">
            <!-- مدخل اسم المستخدم -->
            <input type="text" name="username" placeholder="اسم المستخدم" class="w-full p-2 mb-2 border rounded">

            <!-- مدخل كلمة المرور -->
            <input type="password" name="password" placeholder="كلمة المرور" class="w-full p-2 mb-2 border rounded">

            <!-- زر الدخول -->
            <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded">دخول</button>
        </form>

        <!-- مكان عرض نتيجة التوكن أو الخطأ -->
        <div id="result" class="mt-4 text-green-600 text-sm text-center"></div>
    </div>

</body>
</html>
